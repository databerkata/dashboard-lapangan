<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LapanganKu - Offline</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .offline-box { text-align: center; max-width: 400px; }
    .offline-box h1 { font-size: 32px; margin-bottom: 16px; }
    .offline-box p { color: var(--text2); margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="offline-box">
    <h1>Koneksi terputus</h1>
    <p>Cek internet kamu lalu coba lagi. Data booking kamu tetap aman.</p>
    <button class="btn btn-primary" onclick="location.reload()">Coba lagi</button>
  </div>
</body>
</html>
